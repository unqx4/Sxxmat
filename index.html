<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Keys</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #0f172a, #020617 70%);
      color: #f8fafc;
      font-family: Inter, system-ui, Arial, sans-serif;
    }

    .card {
      width: min(540px, 100%);
      padding: 32px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 24px;
      color: #cbd5e1;
      line-height: 1.75;
    }

    label {
      display: block;
      margin-bottom: 16px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.86);
      color: #eef2ff;
      font-size: 1rem;
      box-sizing: border-box;
    }

    select:focus,
    input:focus,
    button:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.14);
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    button {
      border: none;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .output input {
      font-family: monospace;
      letter-spacing: 0.12em;
      text-align: center;
      cursor: text;
    }

    .note {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .overlay,
    .loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(15, 23, 42, 0.92);
      z-index: 20;
      backdrop-filter: blur(6px);
    }

    .overlay.hidden,
    .loader.hidden {
      display: none;
    }

    .overlay-card,
    .loader-card {
      width: min(520px, 100%);
      padding: 28px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(148, 163, 184, 0.2);
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .overlay-card h2,
    .loader-card h2 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }

    .overlay-card p,
    .loader-card p {
      margin: 0 0 14px;
      color: #cbd5e1;
      line-height: 1.75;
    }

    .spinner {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border: 6px solid rgba(96, 165, 250, 0.25);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .overlay-card button {
      width: auto;
      padding: 12px 22px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Generador de Keys</h1>
    <p>Genera licencias en formato <strong>LIC-XXXXXX</strong> y elige vencimiento para 30, 7 o 1 d�a.</p>

    <label for="duration">Duracion</label>
    <select id="duration">
      <option value="30">30 dias</option>
      <option value="7">7 dias</option>
      <option value="1">1 dia</option>
    </select>

    <div class="actions">
      <div class="button-row">
        <button id="generate">Generar key</button>
        <button id="copy" type="button">Copiar</button>
      </div>

      <label>
        Key generada
        <input id="result" type="text" readonly placeholder="LIC-XXXXXX | 30 d�as" />
      </label>
    </div>

    <p id="status" class="note">Tu generador está por 1 mes.</p>
  </div>

  <script>
    const duration = document.getElementById('duration');
    const generate = document.getElementById('generate');
    const copy = document.getElementById('copy');
    const result = document.getElementById('result');
    const status = document.getElementById('status');

    function randomHex(count) {
      const chars = '0123456789ABCDEF';
      let out = '';
      for (let i = 0; i < count; i++) {
        out += chars[Math.floor(Math.random() * chars.length)];
      }
      return out;
    }

    function generateKey() {
      const code = 'LIC-' + randomHex(6);
      const days = duration.value;
      const suffix = days === '1' ? '1 día' : days + ' días';
      result.value = `${code} | ${suffix}`;
      status.textContent = 'tu generador esta por 1mes';
    }

    generate.addEventListener('click', generateKey);

    copy.addEventListener('click', () => {
      if (!result.value) {
        generateKey();
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(result.value).then(() => {
          copy.textContent = 'Copiado';
          setTimeout(() => { copy.textContent = 'Copiar'; }, 1400);
        }).catch(() => {
          alert('No se pudo copiar.');
        });
      } else {
        alert('El portapapeles no est� disponible.');
      }
    });
  </script>
</body>
</html>
